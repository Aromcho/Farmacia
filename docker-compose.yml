# Base de datos para desarrollo: PostgreSQL 16 en el puerto 5433
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: farmacia
      POSTGRES_PASSWORD: farmacia
      POSTGRES_DB: farmacia
    ports:
      - '5433:5432'
    volumes:
      - farmacia-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U farmacia']
      interval: 5s
      retries: 10
volumes:
  farmacia-db:
